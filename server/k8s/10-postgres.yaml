# Postgres: shared state for LiteLLM, n8n and the agent prompt store.
#
# One database server with three logical databases rather than three servers.
# At ~2 GB resident this is already a meaningful slice of the memory budget,
# and running three would cost triple for no isolation benefit on a single
# node where everything shares a kernel anyway.
#
# A Deployment rather than a StatefulSet: there is exactly one replica, one
# node and one hostPath volume, so StatefulSet's ordering and stable identity
# guarantees buy nothing here.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Postgres pods cannot share one hostPath
    # volume, and a rolling update would try exactly that.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # Run as postgres from the start, rather than starting as root and
        # dropping privileges. This is not only tidier - it is required on
        # Ubuntu 24.04 and later.
        #
        # The entrypoint drops privileges with 'exec gosu postgres', and
        # gosu is a Go program whose runtime signals its own threads with
        # rtmin+1 to preempt goroutines. The AppArmor profile containerd
        # applies there denies cross-profile signals, so gosu hangs before
        # it ever execs postgres:
        #
        #   apparmor="DENIED" operation="signal" comm="gosu"
        #   requested_mask="send" signal=rtmin+1
        #
        # The container stays Running and writes nothing at all - no
        # initdb banner, no error - because postgres has not been reached.
        # Every probe then fails, and the pod looks like a database that
        # will not start rather than one that never started.
        #
        # The entrypoint only calls gosu when it finds itself running as
        # root, so running as 70 directly skips the branch entirely.
        # 70 is the postgres uid in the alpine image; the Debian image
        # uses 999.
        #
        # Unconfined for the same underlying reason, and it is a broader
        # fix than runAsUser. Postgres signals its own backends constantly
        # - SIGURG is how one backend wakes another's latch in 16 - and
        # the profile denies those too:
        #
        #   apparmor="DENIED" operation="signal" comm="postgres"
        #   requested_mask="send" signal=urg
        #
        # Those denials were firing several times a second while the
        # database otherwise appeared healthy, because a simple query
        # needs no wakeup. runAsUser only sidesteps the one signal gosu
        # sends at startup; this covers the ones postgres sends for the
        # rest of its life. runAsUser stays regardless, since not
        # starting as root is right on its own merits.
        #
        # The reasoning for accepting Unconfined is in 11-litellm.yaml.
        appArmorProfile:
          type: Unconfined
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      # fsGroup does nothing here: the kubelet only manages ownership for
      # volume plugins that support it, and hostPath is not one of them. A
      # directory made by DirectoryOrCreate is root:root 0755, which uid 70
      # cannot write. So the chown has to happen in the pod, as root, before
      # the unprivileged container starts.
      #
      # Resources are mandatory rather than good manners - the platform
      # namespace has a ResourceQuota that rejects any pod with a container
      # missing them, init containers included.
      initContainers:
        - name: fix-permissions
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - chown -R 70:70 /var/lib/postgresql/data &&
              chmod 700 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Tuned down from defaults. Postgres sizes itself for a dedicated
          # host; here it is one tenant among several and must not expand into
          # memory the model server needs.
          args:
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_connections=100
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # A liveness probe must not police startup. Without a startupProbe
          # the liveness probe below begins at 60s and kills the container
          # after three more failures - 150s in total. First boot has to run
          # initdb, fsync a fresh cluster to disk and then start; on a drive
          # that is busy doing something else, such as downloading model
          # packs, that can take longer than 150s.
          #
          # What that produces is a loop rather than an error: the kill
          # interrupts initdb, leaving a half-written data directory that
          # makes the next attempt slower still. The pod shows as Running
          # the whole time, the events say only "Liveness probe failed", and
          # nothing anywhere mentions that it was never given time to start.
          #
          # 30 x 10s allows five minutes to become ready once, and liveness
          # does not run at all until the startup probe has passed.
          startupProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
