# Postgres: shared state for LiteLLM, n8n and the agent prompt store.
#
# One database server with three logical databases rather than three servers.
# At ~2 GB resident this is already a meaningful slice of the memory budget,
# and running three would cost triple for no isolation benefit on a single
# node where everything shares a kernel anyway.
#
# A Deployment rather than a StatefulSet: there is exactly one replica, one
# node and one hostPath volume, so StatefulSet's ordering and stable identity
# guarantees buy nothing here.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Postgres pods cannot share one hostPath
    # volume, and a rolling update would try exactly that.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # 70, not 999. The Debian postgres image runs as uid/gid 999; the
        # alpine one used here runs as 70. The mismatch was survivable -
        # fsGroup is added as a supplementary group, so postgres could still
        # write - but it meant the volume was owned by a group nothing in the
        # container belonged to.
        fsGroup: 70
        # Without this, the kubelet walks and chowns the entire volume on
        # every single mount. On a hostPath holding a real database that is
        # slow, it happens before the container starts, and it is time that
        # counts against the startup budget below.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Tuned down from defaults. Postgres sizes itself for a dedicated
          # host; here it is one tenant among several and must not expand into
          # memory the model server needs.
          args:
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_connections=100
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # A liveness probe must not police startup. Without a startupProbe
          # the liveness probe below begins at 60s and kills the container
          # after three more failures - 150s in total. First boot has to run
          # initdb, fsync a fresh cluster to disk and then start; on a drive
          # that is busy doing something else, such as downloading model
          # packs, that can take longer than 150s.
          #
          # What that produces is a loop rather than an error: the kill
          # interrupts initdb, leaving a half-written data directory that
          # makes the next attempt slower still. The pod shows as Running
          # the whole time, the events say only "Liveness probe failed", and
          # nothing anywhere mentions that it was never given time to start.
          #
          # 30 x 10s allows five minutes to become ready once, and liveness
          # does not run at all until the startup probe has passed.
          startupProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
