# LiteLLM: the gateway that makes "expose models" survivable.
#
# This is the component that actually orchestrates model access, and the only
# place in the build where per-user identity exists. It provides:
#
#   * virtual API keys, one per person or per agent role
#   * spend budgets and request rate limits per key
#   * a single OpenAI-compatible endpoint in front of Strata, llama.cpp
#     and the voice server
#   * request logging to Postgres, so you can see who ran what
#
# Without it, sharing means handing out unauthenticated access to an
# unmetered GPU. With it, a friend gets a revocable key with a ceiling.
#
# The serialisation point: 16 GB of VRAM serves one model at a time, so
# concurrent requests queue. That is a feature here - it is what stops five
# simultaneous jobs from thrashing.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: platform
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: database-url
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: salt-key
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "2"
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: platform
data:
  # Every model here points at a host service through the cluster DNS names
  # created in 03-host-models.yaml.
  #
  # Note that "strata" is whichever pack is currently launched. Strata
  # serves one at a time, so these are role aliases rather than distinct
  # models - see reference/agent-orchestration.md.
  #
  # This text must stay byte-identical to the chart in
  # gitops/source/platform/templates/_helpers.tpl. Argo CD compares the
  # rendered ConfigMap as a string, so a reflowed comment reads as drift
  # and blocks adoption. The comment above sits outside the value on
  # purpose: it documents the file without becoming part of the data.
  config.yaml: |
    model_list:
      # The resident Strata pack. Used by brain and worker roles with different
      # reasoning_effort rather than different models.
      - model_name: brain
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          # Highest reasoning tier. Strata's own default, stated explicitly so the
          # intent is visible in the config rather than implied.
          reasoning_effort: xhigh
          timeout: 900

      - model_name: worker
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          # Short reasoning: workers execute a decided plan, they do not plan.
          reasoning_effort: low
          timeout: 300

      # The small GGUF held in VRAM by llama.cpp. Independent of Strata, which is
      # the whole point - a checker that shares a model with the worker shares its
      # blind spots too.
      - model_name: checker
        litellm_params:
          model: openai/local
          api_base: http://llamacpp.platform.svc.cluster.local:8081/v1
          api_key: "local"
          timeout: 180

      # Plain passthrough, for chat and anything that wants the raw model.
      - model_name: strata
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          timeout: 900

      - model_name: local
        litellm_params:
          model: openai/local
          api_base: http://llamacpp.platform.svc.cluster.local:8081/v1
          api_key: "local"
          timeout: 300

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # A concurrency cap, not a queue. Beyond this LiteLLM returns 429 - it
      # does not hold the request. Holding is what gpu-queue on 4100 does, and
      # it does that knowing what the GPU is actually doing. This is the hard
      # backstop underneath it, and it still applies to anything that bypasses
      # the queue and calls the gateway directly.
      #
      # 4 is deliberately low: Strata's hybrid mode holds ~1.5 GB of KV cache
      # per parallel slot at 32K context, and a 16 GB card supports about two
      # slots at that length.
      max_parallel_requests: 4

    litellm_settings:
      drop_params: true
      # Keep request logs bounded; see the retention table in
      # reference/server-architecture.md.
      maximum_spend_logs_retention_period: "30d"
      request_timeout: 900
      # Do not retry a timed-out generation. On this hardware a timeout means the
      # model is loading or the queue is deep, and a retry makes both worse.
      num_retries: 0