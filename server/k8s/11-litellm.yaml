# LiteLLM: the gateway that makes "expose models" survivable.
#
# This is the component that actually orchestrates model access, and the only
# place in the build where per-user identity exists. It provides:
#
#   * virtual API keys, one per person or per agent role
#   * spend budgets and request rate limits per key
#   * a single OpenAI-compatible endpoint in front of Strata, llama.cpp
#     and the voice server
#   * request logging to Postgres, so you can see who ran what
#
# Without it, sharing means handing out unauthenticated access to an
# unmetered GPU. With it, a friend gets a revocable key with a ceiling.
#
# The serialisation point: 16 GB of VRAM serves one model at a time, so
# concurrent requests queue. That is a feature here - it is what stops five
# simultaneous jobs from thrashing.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: platform
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      securityContext:
        # Ubuntu 24.04's AppArmor will not let a container process signal
        # its own child, and LiteLLM cannot start without doing so.
        #
        # On boot it shells out to the Prisma CLI, which spawns a
        # schema-engine subprocess, does its work, and then calls kill()
        # to shut it down. That kill fails:
        #
        #   [schema-engine] error: Error: kill EACCES
        #       at ChildProcess.kill (node:internal/child_process)
        #       at SchemaEngine.stop (.../prisma/build/index.js)
        #     errno: -13, syscall: 'kill'
        #
        # The engine never exits, so the CLI never exits, so LiteLLM waits
        # on it forever and port 4000 is never opened. Everything before
        # that point succeeds - the migrations apply and the schema is
        # reported up to date - which is what makes it so misleading: the
        # pod sits at 0/1 Running, at zero CPU, having already finished
        # the work it appears to be stuck on.
        #
        # The cause is the cri-containerd.apparmor.d profile denying
        # signals to a peer in its &unconfined subprofile. It is the same
        # defect that stops gosu reaching postgres in 10-postgres.yaml,
        # and it is not specific to Prisma - any image whose entrypoint
        # supervises a child process can hit it.
        #
        # Unconfined is a real reduction in isolation and worth stating
        # plainly. It is acceptable here because these services are bound
        # to loopback on a single-user workstation, the container is not
        # privileged and does not run as root, and the alternative is
        # shipping a patched host profile that every rebuild must
        # reapply. See reference/troubleshooting.md.
        appArmorProfile:
          type: Unconfined
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: database-url
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: salt-key
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "2"
          volumeMounts:
            - name: config
              mountPath: /config
          # On first boot LiteLLM applies 233 Prisma migrations before it
          # binds port 4000, and it allows itself 600s to do it. Port 4000
          # is closed for that whole time.
          #
          # Without a startupProbe the liveness probe starts its own clock
          # immediately, and no initialDelaySeconds large enough to cover a
          # migration is a sane steady-state liveness setting. Worse, the
          # failure is self-perpetuating: the probe kills the container
          # part-way through, the replacement starts the 233 migrations
          # again from the beginning, and it never converges because the
          # restart budget is smaller than the work.
          #
          # A startupProbe is the mechanism for exactly this. Liveness does
          # not begin until this has succeeded once, so slow start and
          # "wedged after running for a week" get separate budgets instead
          # of being forced to share one number.
          #
          # 10s x 90 = 900s, comfortably over LiteLLM's own 600s ceiling,
          # because being killed mid-migration is far more expensive than
          # noticing a genuine failure five minutes late. Subsequent boots
          # have nothing to migrate and pass in well under a minute.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: platform
data:
  # Every model here points at a host service through the cluster DNS names
  # created in 03-host-models.yaml.
  #
  # Note that "strata" is whichever pack is currently launched. Strata
  # serves one at a time, so these are role aliases rather than distinct
  # models - see reference/agent-orchestration.md.
  #
  # This text must stay byte-identical to the chart in
  # gitops/source/platform/templates/_helpers.tpl. Argo CD compares the
  # rendered ConfigMap as a string, so a reflowed comment reads as drift
  # and blocks adoption. The comment above sits outside the value on
  # purpose: it documents the file without becoming part of the data.
  config.yaml: |
    model_list:
      # The resident Strata pack. Used by brain and worker roles with different
      # reasoning_effort rather than different models.
      - model_name: brain
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          # Highest reasoning tier. Strata's own default, stated explicitly so the
          # intent is visible in the config rather than implied.
          reasoning_effort: xhigh
          timeout: 900

      - model_name: worker
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          # Short reasoning: workers execute a decided plan, they do not plan.
          reasoning_effort: low
          timeout: 300

      # The small GGUF held in VRAM by llama.cpp. Independent of Strata, which is
      # the whole point - a checker that shares a model with the worker shares its
      # blind spots too.
      - model_name: checker
        litellm_params:
          model: openai/local
          api_base: http://llamacpp.platform.svc.cluster.local:8081/v1
          api_key: "local"
          timeout: 180

      # Plain passthrough, for chat and anything that wants the raw model.
      - model_name: strata
        litellm_params:
          model: openai/strata
          api_base: http://strata.platform.svc.cluster.local:8080/v1
          api_key: "local"
          timeout: 900

      - model_name: local
        litellm_params:
          model: openai/local
          api_base: http://llamacpp.platform.svc.cluster.local:8081/v1
          api_key: "local"
          timeout: 300

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # A concurrency cap, not a queue. Beyond this LiteLLM returns 429 - it
      # does not hold the request. Holding is what gpu-queue on 4100 does, and
      # it does that knowing what the GPU is actually doing. This is the hard
      # backstop underneath it, and it still applies to anything that bypasses
      # the queue and calls the gateway directly.
      #
      # 4 is deliberately low: Strata's hybrid mode holds ~1.5 GB of KV cache
      # per parallel slot at 32K context, and a 16 GB card supports about two
      # slots at that length.
      max_parallel_requests: 4

    litellm_settings:
      drop_params: true
      # Keep request logs bounded; see the retention table in
      # reference/server-architecture.md.
      maximum_spend_logs_retention_period: "30d"
      request_timeout: 900
      # Do not retry a timed-out generation. On this hardware a timeout means the
      # model is loading or the queue is deep, and a retry makes both worse.
      num_retries: 0