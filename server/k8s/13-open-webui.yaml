# Open WebUI, moved from a user systemd unit into the cluster.
#
# It was a --user unit in ubuntu/08-remote-access.sh, which stops at logout.
# On an always-on server it belongs with the rest of the platform.
#
# Points at LiteLLM rather than directly at Strata, so chat traffic is keyed
# and logged the same way everything else is, and so switching the resident
# Strata pack needs no change here.
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: platform
spec:
  selector:
    app: open-webui
  ports:
    - port: 3000
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.platform.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            # Audio still goes straight to the host voice server: LiteLLM
            # proxies chat completions, not /v1/audio/*.
            - name: AUDIO_STT_ENGINE
              value: openai
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: "http://voice.platform.svc.cluster.local:8100/v1"
            - name: AUDIO_TTS_ENGINE
              value: openai
            - name: AUDIO_TTS_OPENAI_API_BASE_URL
              value: "http://voice.platform.svc.cluster.local:8100/v1"
            - name: WEBUI_AUTH
              value: "True"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-credentials
                  key: secret-key
            # No telemetry, and no model downloads of its own - every model
            # comes through the gateway.
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            - name: ENABLE_OLLAMA_API
              value: "False"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1536Mi
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
