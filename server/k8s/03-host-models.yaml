# In-cluster DNS names for the model servers that run on the host.
#
# Strata mlocks 25-30 GB, owns the GPU and takes 1-3 minutes to load, so it
# stays outside Kubernetes. Pods still need a stable address for it, and
# hardcoding an IP into every workload is how you end up unable to move
# anything. A Service with no selector plus a hand-written EndpointSlice gives
# normal cluster DNS pointing at the host.
#
# ${HOST_IP} is substituted by server/02-k3s.sh with the cni0 gateway address,
# normally 10.42.0.1. The socat bridge in ai-model-bridge.service forwards that
# address to 127.0.0.1, so the services themselves never leave loopback and
# stay invisible to the LAN.
#
# A Service with no selector gets no automatic endpoints, which is exactly why
# this works - we supply them ourselves.
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: platform
  annotations:
    description: "Strata on the host - whichever pack is currently launched"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: strata-host
  namespace: platform
  labels:
    kubernetes.io/service-name: strata
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - "${HOST_IP}"
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: platform
  annotations:
    description: "llama.cpp on the host - small model held in VRAM"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llamacpp-host
  namespace: platform
  labels:
    kubernetes.io/service-name: llamacpp
addressType: IPv4
ports:
  - name: http
    port: 8081
    protocol: TCP
endpoints:
  - addresses:
      - "${HOST_IP}"
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: voice
  namespace: platform
  annotations:
    description: "Whisper + Kokoro voice server on the host"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8100
      targetPort: 8100
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: voice-host
  namespace: platform
  labels:
    kubernetes.io/service-name: voice
addressType: IPv4
ports:
  - name: http
    port: 8100
    protocol: TCP
endpoints:
  - addresses:
      - "${HOST_IP}"
    conditions:
      ready: true
