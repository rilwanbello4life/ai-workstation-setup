# n8n: the automation platform, and where the agent topology actually lives.
#
# Backed by Postgres rather than its default SQLite. SQLite is fine for a
# laptop trial and a liability here: workflow history, credentials and
# execution state in one file with no concurrent access story.
#
# n8n reaches models through LiteLLM, never directly, so every workflow call
# is keyed, budgeted and logged like any other client.
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: platform
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              value: n8n
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-credentials
                  key: db-password
            # Encrypts stored credentials. Losing this key means every saved
            # credential in every workflow becomes unreadable, which is why
            # 03-platform.sh persists it to /srv and never regenerates it.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-credentials
                  key: encryption-key
            # The code sandbox for the Assistant and Agents. Configured here
            # rather than through the settings page so it survives a pod
            # restart and is visible in the repository.
            #
            # These are harmless when the sandbox is not built: n8n reports
            # the Assistant's code features as unavailable rather than
            # failing to start. The Secret below is optional for the same
            # reason - server/10-sandbox.sh creates it, and marking it
            # optional means n8n still boots on a machine that never ran
            # that script.
            #
            # 'sandbox' resolves through the Service in 14-sandbox-bridge.yaml,
            # which points at a VM rather than a pod. See 10-sandbox.sh for
            # why it is a VM and not a Sysbox node pool.
            - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
              value: "true"
            - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
              value: "n8n-sandbox"
            - name: N8N_SANDBOX_SERVICE_URL
              value: "http://sandbox.platform.svc.cluster.local:8080"
            - name: N8N_SANDBOX_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-credentials
                  key: api-key
                  optional: true
            - name: N8N_HOST
              value: "127.0.0.1"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http
            - name: WEBHOOK_URL
              value: "http://127.0.0.1:5678/"
            # Execution history grows without bound by default and is the
            # fastest-growing table in the whole platform.
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "336"           # hours, i.e. 14 days
            - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
              value: "none"          # only keep failures; successes are noise
            - name: EXECUTIONS_DATA_SAVE_ON_ERROR
              value: "all"
            # Required for the meta-automation pattern: workflows that read
            # and write other workflows through n8n's own REST API.
            - name: N8N_PUBLIC_API_DISABLED
              value: "false"
            - name: GENERIC_TIMEZONE
              value: "Europe/Stockholm"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            # Lets Code nodes require the Postgres client, used by the agent
            # workflows to read and write the prompt store directly.
            - name: NODE_FUNCTION_ALLOW_EXTERNAL
              value: "pg"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1536Mi
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
