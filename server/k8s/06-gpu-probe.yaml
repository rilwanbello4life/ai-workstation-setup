# In-cluster DNS for the two host endpoints the GPU queue needs.
#
# gpu-probe  reports what the card is actually doing. The queue cannot make
#            an admission decision from inside a pod without it: there is no
#            GPU device plugin here, because Strata owns the card directly
#            and never goes through Kubernetes.
#
# comfyui    the batch job target. Image and video generation is the one
#            workload heavy enough that serialising it is the whole point of
#            having a queue.
#
# These are ordinary selector Services; the proxy pods behind them, the
# unix sockets they dial, and the host unit that owns those sockets all
# belong to 03-host-models.yaml. Both host services are in the proxy and in
# /etc/ai-model-bridge/services from the start, so applying 09-gpu-queue.sh
# later adds nothing to the bridge - it only publishes the names.
apiVersion: v1
kind: Service
metadata:
  name: gpu-probe
  namespace: platform
  annotations:
    description: "nvidia-smi as JSON - utilisation and free VRAM, read-only"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: host-model-proxy
  ports:
    - name: http
      port: 8101
      targetPort: 8101
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: platform
  annotations:
    description: "ComfyUI on the host - batch image and video jobs"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: host-model-proxy
  ports:
    - name: http
      port: 8188
      targetPort: 8188
      protocol: TCP
