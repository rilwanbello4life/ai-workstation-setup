apiVersion: v1
kind: Service
metadata:
  name: gpu-queue
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: gpu-queue
  ports:
    - port: 4100
      targetPort: 4100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-queue
  namespace: {{ .Values.namespace }}
spec:
  # One replica, and this is a correctness constraint rather than a sizing
  # choice. The admission counters live in memory, so two replicas would
  # each admit up to the limit and the card would see twice what either of
  # them believes it allowed.
  replicas: {{ .Values.replicas }}
  strategy:
    # Recreate, for the same reason: a rolling update briefly runs two pods,
    # and during that window the effective concurrency limit doubles.
    type: Recreate
  selector:
    matchLabels:
      app: gpu-queue
  template:
    metadata:
      labels:
        app: gpu-queue
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: gpu-queue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4100
          env:
            - name: LITELLM_BASE
              value: "http://litellm.{{ .Values.namespace }}.svc.cluster.local:4000"
            - name: GPU_PROBE_BASE
              value: "http://gpu-probe.{{ .Values.namespace }}.svc.cluster.local:8101"
            - name: COMFYUI_BASE
              value: "http://comfyui.{{ .Values.namespace }}.svc.cluster.local:8188"
            # Profiles, skills and the job table live in the same database as
            # the spend tables and the agent prompt store.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: database-url
            # Used for two things only: recognising the owner's own requests,
            # and authorising the /queue admin endpoints that `queue drain`
            # calls. Guest traffic is authorised by LiteLLM downstream using
            # the caller's own key, which this service forwards untouched.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            - name: VRAM_RESERVE_MB
              value: {{ .Values.admission.vramReserveMb | quote }}
            - name: MAX_HEAVY
              value: {{ .Values.admission.maxHeavy | quote }}
            - name: LIGHT_FLOOR
              value: {{ .Values.admission.lightFloor | quote }}
            - name: LIGHT_CEILING
              value: {{ .Values.admission.lightCeiling | quote }}
            - name: IDLE_UTIL_PCT
              value: {{ .Values.admission.idleUtilPct | quote }}
            - name: GROWTH_HEADROOM_MB
              value: {{ .Values.admission.growthHeadroomMb | quote }}
            - name: HEAVY_MODELS
              value: {{ .Values.admission.heavyModels | quote }}
            - name: HEAVY_MAX_TOKENS
              value: {{ .Values.admission.heavyMaxTokens | quote }}
            - name: QUEUE_TIMEOUT
              value: {{ .Values.timeouts.queueSeconds | quote }}
            - name: UPSTREAM_TIMEOUT
              value: {{ .Values.timeouts.upstreamSeconds | quote }}
            - name: OUTPUT_DIR
              value: /outputs
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: outputs
              mountPath: /outputs
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4100
            initialDelaySeconds: 30
            # Generous: the event loop is busy relaying long generations, and
            # restarting the queue mid-answer drops everyone's in-flight work.
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
      volumes:
        - name: outputs
          hostPath:
            path: {{ .Values.outputHostPath }}
            type: DirectoryOrCreate
