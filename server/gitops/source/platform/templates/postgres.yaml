{{- /*
Postgres: shared state for LiteLLM, n8n, the agent prompt store and the
GPU queue's user profiles and job table.

One database server with three logical databases rather than three servers.
At ~2 GB resident this is already a meaningful slice of the memory budget,
and running three would cost triple for no isolation benefit on a single
node where everything shares a kernel anyway.

A Deployment rather than a StatefulSet: there is exactly one replica, one
node and one hostPath volume, so StatefulSet's ordering and stable identity
guarantees buy nothing here.

The PersistentVolumeClaim this mounts is NOT part of this chart. It stays in
server/k8s/02-storage.yaml, applied once at bootstrap, because an Argo CD
prune that removed a PVC would take the database with it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Postgres pods cannot share one hostPath
    # volume, and a rolling update would try exactly that.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # This block must stay in step with server/k8s/10-postgres.yaml, which
      # carries the full reasoning for each line. In short, all three exist
      # because of Ubuntu 24.04's AppArmor profile and hostPath ownership:
      #
      #   appArmorProfile  the profile denies cross-profile signals, which
      #                    hangs gosu at startup and blocks the SIGURG that
      #                    postgres backends use to wake each other
      #   runAsUser 70     skips the entrypoint's gosu branch entirely
      #   initContainer    fsGroup does nothing on a hostPath volume, so the
      #                    chown has to happen in the pod, as root
      securityContext:
        appArmorProfile:
          type: Unconfined
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - chown -R 70:70 /var/lib/postgresql/data &&
              chmod 700 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Mandatory, not manners: the namespace ResourceQuota rejects any
          # pod with a container missing them, init containers included.
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - -c
            - shared_buffers={{ .Values.postgres.sharedBuffers }}
            - -c
            - effective_cache_size={{ .Values.postgres.effectiveCacheSize }}
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # A liveness probe must not police startup. First boot runs initdb
          # and fsyncs a fresh cluster to a drive that may be busy pulling
          # model packs, which can exceed any sane liveness budget - and the
          # kill leaves a half-written data directory that makes the next
          # attempt slower still. See server/k8s/10-postgres.yaml.
          startupProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
