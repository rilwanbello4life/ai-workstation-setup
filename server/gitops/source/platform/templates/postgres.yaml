{{- /*
Postgres: shared state for LiteLLM, n8n, the agent prompt store and the
GPU queue's user profiles and job table.

One database server with three logical databases rather than three servers.
At ~2 GB resident this is already a meaningful slice of the memory budget,
and running three would cost triple for no isolation benefit on a single
node where everything shares a kernel anyway.

A Deployment rather than a StatefulSet: there is exactly one replica, one
node and one hostPath volume, so StatefulSet's ordering and stable identity
guarantees buy nothing here.

The PersistentVolumeClaim this mounts is NOT part of this chart. It stays in
server/k8s/02-storage.yaml, applied once at bootstrap, because an Argo CD
prune that removed a PVC would take the database with it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Postgres pods cannot share one hostPath
    # volume, and a rolling update would try exactly that.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - -c
            - shared_buffers={{ .Values.postgres.sharedBuffers }}
            - -c
            - effective_cache_size={{ .Values.postgres.effectiveCacheSize }}
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres"]
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
