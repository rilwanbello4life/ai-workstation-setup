# Values for the platform chart.
#
# These defaults reproduce what server/03-platform.sh applies today. Changing
# one here, running `gitops commit` and watching Argo CD roll it out is the
# whole point of the exercise.

namespace: platform

# Host services reached through cluster DNS. Ports match reference/ports.md.
#
# Each name below is an ordinary selector Service backed by a socat pod in
# the host-model-proxy DaemonSet (templates/host-models.yaml), which dials a
# unix socket the host unit publishes in hostProxy.socketDir. No host
# address is involved anywhere - that is the whole point. The previous
# version of this file carried a hostIP value and hand-wrote EndpointSlices
# at it, and the box went dark the moment the forwarding unit died while
# systemd still reported it active; a different pod CIDR would have broken
# it just as quietly.
#
# Every entry here needs a matching line in /etc/ai-model-bridge/services
# on the host (server/common.sh, host_model_bridge_add) or the proxy will
# accept connections and drop them - a visible failure, not a silent one.
hostServices:
  strata:
    port: 8080
    description: "Strata on the host - whichever pack is currently launched"
  llamacpp:
    port: 8081
    description: "llama.cpp on the host - small model held in VRAM"
  voice:
    port: 8100
    description: "Whisper + Kokoro voice server on the host"
  gpu-probe:
    port: 8101
    description: "nvidia-smi as JSON - utilisation and free VRAM, read-only"
  comfyui:
    port: 8188
    description: "ComfyUI on the host - batch image and video jobs"
  gitops:
    port: 9418
    portName: git
    description: "Bare git repo on the host - the source of truth Argo CD reads"

# The proxy DaemonSet's own settings.
hostProxy:
  image: alpine/socat:1.8.0.0
  # Where ai-model-bridge.service v2 puts its sockets, and what the DaemonSet
  # hostPath-mounts read-only.
  socketDir: /run/ai-model-bridge
  # Only nodes that actually run the host unit get a proxy pod; the label is
  # applied by server/02-k3s.sh.
  nodeSelector:
    ai.workstation/host-models: "true"

postgres:
  image: postgres:16-alpine
  # Tuned down from the defaults. Postgres sizes itself for a dedicated host;
  # here it is one tenant among several and must not expand into memory the
  # model server needs.
  sharedBuffers: 512MB
  effectiveCacheSize: 1536MB
  maxConnections: 100
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: "2"

litellm:
  image: ghcr.io/berriai/litellm:main-stable
  resources:
    requests:
      memory: 384Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: "2"
  # Strata's hybrid mode holds roughly 1.5 GB of KV cache per parallel slot at
  # 32K context, and a 16 GB card supports about two slots at that length.
  #
  # Note what this setting does and does not do: beyond this number LiteLLM
  # REJECTS with a 429. It does not hold the request. Queueing is the job of
  # the gpu-queue service in front of it, which is why this can stay low.
  maxParallelRequests: 4
  requestTimeout: 900
  spendLogsRetention: "30d"

n8n:
  image: docker.n8n.io/n8nio/n8n:latest
  timezone: Europe/Stockholm
  # Execution history grows without bound by default and is the fastest
  # growing table in the whole platform.
  executionsMaxAgeHours: "336"
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1536Mi
      cpu: "2"

openWebui:
  image: ghcr.io/open-webui/open-webui:main
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1536Mi
      cpu: "2"
